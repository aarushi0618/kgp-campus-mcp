[project]
name = "kgp-campus-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aarushi0618", email = "aarushi18096@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "mcp>=2.2.0",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.7",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]