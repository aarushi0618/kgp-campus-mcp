[project]
name = "kgp-campus-mcp"
version = "0.1.0"
description = "KGP Campus Intelligence MCP Server - Stateless AI interface for IIT Kharagpur campus data"
readme = "README.md"
authors = [
    { name = "aarushi0618", email = "aarushi18096@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.22.1",
    "beautifulsoup4>=4.15.0",
    "google-genai>=2.30.1",
    "httpx>=0.28.1",
    "iitkgp-erp-login>=2.4.6",
    "mcp>=2.2.0",
    "pdfplumber>=0.11.10",
    "playwright>=1.64.0",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "pypdf2>=3.0.1",
    "requests>=2.34.2",
    "tenacity>=9.1.4",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

# ⭐ THIS IS THE FIX — tell uv_build where the real package lives
[tool.uv.build-backend]
module-name = "kgp_mcp"
module-root = "src"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
